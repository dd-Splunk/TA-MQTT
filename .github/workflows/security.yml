name: Security

on:
    pull_request:
        branches:
            - main
            - develop
    push:
        branches:
            - main
            - develop
    workflow_dispatch:

concurrency:
    group: ta-mqtt-security-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    secret_scan:
        name: Secret scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
