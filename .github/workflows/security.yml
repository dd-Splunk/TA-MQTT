name: Security

on:
    pull_request:
        branches:
            - main
            - develop
    push:
        branches:
            - main
            - develop
    workflow_dispatch:

concurrency:
    group: ta-mqtt-security-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    secret_scan:
        name: Secret scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
