name: CodeQL

on:
    pull_request:
        branches:
            - main
            - develop
    push:
        branches:
            - main
            - develop
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: ta-mqtt-codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Initialize CodeQL
              uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
              with:
                  languages: python
                  config-file: .github/codeql/codeql-config.yml

            - name: Set up Python 3.13
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.13"

            - name: Install runtime dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  python3 -m pip install --upgrade pip
                  python3 -m pip install -r package/lib/requirements.txt

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
              with:
                  category: /language:python
