name: CodeQL

on:
    pull_request:
        branches:
            - main
            - develop
    push:
        branches:
            - main
            - develop
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: ta-mqtt-codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Initialize CodeQL
              uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
              with:
                  languages: python
                  config-file: .github/codeql/codeql-config.yml

            - name: Set up Python 3.13
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.13"

            - name: Install runtime dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  python3 -m pip install --upgrade pip
                  python3 -m pip install -r package/lib/requirements.txt

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
              with:
                  category: /language:python
