name: Build and Release TA-MQTT

on:
    push:
        branches:
            - main
            - develop
        tags:
            - "v*"
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch:

concurrency:
    group: ta-mqtt-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and Package
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            app_version: ${{ steps.version.outputs.app_version }}
            spl_name: ${{ steps.package.outputs.spl_name }}
            build_tag: ${{ steps.meta.outputs.build_tag }}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: Set up Python 3.13
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.13"

            - name: Extract app version
              id: version
              shell: bash
              run: |
                  set -euo pipefail
                  APP_VERSION=$(python3 -c 'import json; print(json.load(open("package/app.manifest", "r", encoding="utf-8"))["info"]["id"]["version"])')
                  if [[ -z "$APP_VERSION" ]]; then
                    echo "Failed to extract app version from package/app.manifest" >&2
                    exit 1
                  fi
                  echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
                  echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

            - name: Compute build metadata
              id: meta
              shell: bash
              run: |
                  set -euo pipefail
                  SHORT_SHA="${GITHUB_SHA::7}"
                  BUILD_TAG="build-${SHORT_SHA}"
                  echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
                  echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

            - name: Enforce changelog update on version change
              shell: bash
              run: |
                  set -euo pipefail

                  before_version=""
                  changed_files=""

                  if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
                    BASE_REF="${{ github.base_ref }}"
                    git fetch --no-tags --prune --depth=1 origin "$BASE_REF"
                    before_version=$(git show "origin/${BASE_REF}:package/app.manifest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["id"]["version"])')
                    changed_files=$(git diff --name-only "origin/${BASE_REF}...${GITHUB_SHA}")
                  elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
                    before_version=$(git show "${{ github.event.before }}:package/app.manifest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["id"]["version"])')
                    changed_files=$(git diff --name-only "${{ github.event.before }}..${GITHUB_SHA}")
                  else
                    echo "No previous revision available for version diff; skipping changelog gate."
                    exit 0
                  fi

                  if [[ "$before_version" != "$APP_VERSION" ]]; then
                    if ! grep -qx "CHANGELOG.md" <<< "$changed_files"; then
                      echo "Version changed from $before_version to $APP_VERSION, but CHANGELOG.md was not updated." >&2
                      exit 1
                    fi
                  fi

            - name: Create virtual environment
              shell: bash
              run: |
                  set -euo pipefail
                  python3 -m venv .venv

            - name: Install build dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  ./.venv/bin/pip install --upgrade pip
                  ./.venv/bin/pip install -r requirements-build.txt

            - name: Build add-on
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf output/TA-MQTT
                  ./.venv/bin/ucc-gen build --python-binary-name ./.venv/bin/python --ta-version "$APP_VERSION" --overwrite

            - name: Install AppInspect system dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends libmagic1

            - name: Validate add-on with ucc-gen validate
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p artifacts
                  ./.venv/bin/ucc-gen validate \
                    --addon-path output/TA-MQTT \
                    --output-file artifacts/appinspect.json
                  python3 - <<'EOF'
                  import json
                  import sys

                  payload = json.load(open("artifacts/appinspect.json", encoding="utf-8"))
                  failures = []
                  for report in payload.get("reports", []):
                      for group in report.get("groups", []):
                          for check in group.get("checks", []):
                              if check.get("result") in {"failure", "error"}:
                                  failures.append(check)

                  if failures:
                      print("AppInspect reported blocking failures:", file=sys.stderr)
                      for check in failures[:20]:
                          print(f"  - {check.get('name')}: {check.get('result')}", file=sys.stderr)
                      sys.exit(1)
                  print("AppInspect validation passed.")
                  EOF

            - name: Upload AppInspect report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: appinspect-report
                  path: artifacts/appinspect.json
                  retention-days: 30

            - name: Package .spl artifact
              id: package
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ ! -d output/TA-MQTT ]]; then
                    echo "Build output directory output/TA-MQTT not found." >&2
                    exit 1
                  fi
                  mkdir -p dist
                  SPL_NAME="TA-MQTT-${APP_VERSION}.spl"
                  STAGE_DIR=$(mktemp -d)
                  mkdir -p "${STAGE_DIR}/TA_MQTT"
                  cp -R output/TA-MQTT/. "${STAGE_DIR}/TA_MQTT/"
                  tar -czf "dist/${SPL_NAME}" -C "${STAGE_DIR}" TA_MQTT
                  rm -rf "${STAGE_DIR}"
                  FIRST_ENTRY=$(tar -tzf "dist/${SPL_NAME}" | sed -n '1p')
                  if [[ ! "$FIRST_ENTRY" =~ ^(\./)?TA_MQTT/ ]]; then
                    echo "Package validation failed: TA_MQTT/ root is missing." >&2
                    exit 1
                  fi
                  echo "spl_name=${SPL_NAME}" >> "$GITHUB_OUTPUT"

            - name: Enforce build/publish version parity inputs
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ "${{ steps.package.outputs.spl_name }}" != "TA-MQTT-${APP_VERSION}.spl" ]]; then
                    echo "Artifact name does not match app version ${APP_VERSION}." >&2
                    exit 1
                  fi

            - name: Upload packaged artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ta-mqtt-spl
                  path: dist/${{ steps.package.outputs.spl_name }}
                  retention-days: 30

    release_latest:
        name: Publish Latest Prerelease
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: write
        steps:
            - name: Download packaged artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: ta-mqtt-spl
                  path: dist

            - name: Publish prerelease for this commit
              uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
              with:
                  tag_name: ${{ needs.build.outputs.build_tag }}
                  name: latest (prerelease) - ${{ needs.build.outputs.build_tag }}
                  prerelease: true
                  make_latest: false
                  generate_release_notes: true
                  files: dist/${{ needs.build.outputs.spl_name }}
                  body: |
                      Stream: latest prerelease
                      Build: ${{ needs.build.outputs.build_tag }}
                      Commit: ${{ github.sha }}
                      App version: ${{ needs.build.outputs.app_version }}

    release_stable:
        name: Publish Stable Tagged Release
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        steps:
            - name: Verify tag matches app version
              shell: bash
              run: |
                  set -euo pipefail
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  APP_VERSION="${{ needs.build.outputs.app_version }}"
                  if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
                    echo "Tag version v${TAG_VERSION} does not match app version ${APP_VERSION}." >&2
                    exit 1
                  fi

            - name: Download packaged artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: ta-mqtt-spl
                  path: dist

            - name: Generate SHA-256 checksum
              shell: bash
              run: |
                  set -euo pipefail
                  SPL_FILE="dist/${{ needs.build.outputs.spl_name }}"
                  if [[ ! -f "$SPL_FILE" ]]; then
                    echo "Expected release artifact not found: $SPL_FILE" >&2
                    exit 1
                  fi
                  sha256sum "$SPL_FILE" | tee "${SPL_FILE}.sha256"

            - name: Publish stable release
              uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
              with:
                  tag_name: ${{ github.ref_name }}
                  name: TA-MQTT v${{ needs.build.outputs.app_version }}
                  prerelease: false
                  make_latest: true
                  generate_release_notes: true
                  files: |
                      dist/${{ needs.build.outputs.spl_name }}
                      dist/${{ needs.build.outputs.spl_name }}.sha256
