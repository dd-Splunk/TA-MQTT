# TA-MQTT — props for the mqtt:message sourcetype

[mqtt:message]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIME_FORMAT      = %s
KV_MODE          = json

# Extract selected payload JSON child keys with a single search-time path.
# Keeping one path avoids duplicate field names such as foo and foo_.

# Reliable fallback extractions from payload JSON string.
EVAL-temperature_celsius = spath(payload, "temperature_celsius")
EVAL-humidity_percent = spath(payload, "humidity_percent")
EVAL-pressure_millibar = spath(payload, "pressure_millibar")
EVAL-illuminance_lux = spath(payload, "illuminance_lux")
EVAL-uv_index = spath(payload, "uv_index")
EVAL-timestamp = spath(payload, "timestamp")
EVAL-v = spath(payload, "v")
EVAL-temp = spath(payload, "temp")
EVAL-humidity = spath(payload, "humidity")
EVAL-ok = spath(payload, "ok")
EVAL-state = spath(payload, "state")
EVAL-sensor_id = spath(payload, "sensor_id")
# CIM field aliases (IoT / Network Traffic model)
FIELDALIAS-dest = mqtt_host AS dest
FIELDALIAS-dest_port = port AS dest_port

# Search-time extraction above is extraction-only and does not rewrite raw data.
