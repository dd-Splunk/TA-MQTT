# TA-MQTT — default input stanza
# UCC generates per-input stanzas at [mqtt_subscriber://<name>].
# This file sets default values inherited by every mqtt_subscriber input.

[mqtt_subscriber]
python.version = python3
interval     = -1
sourcetype   = mqtt:message
index        = default
topic        = #
qos          = 0
mqtt_client_id =
