# TA-MQTT — default input stanza
# UCC generates per-input stanzas at [mqtt_subscriber://<name>].
# This file sets default values inherited by every mqtt_subscriber input.

[mqtt_subscriber]
python.version = python3
interval     = -1
sourcetype   = mqtt:message
index        = default
topic        = #
qos          = 0
mqtt_client_id =
batch_mode = 0
output_mode = modinput_single_event
hec_endpoint = https://localhost:8088/services/collector/event
hec_token =
hec_verify_tls = 1
hec_batch_max_events = 500
hec_batch_max_bytes = 1048576
hec_flush_interval_ms = 250
hec_retry_max_attempts = 5
hec_retry_backoff_ms = 200
