# TA-MQTT — field extractions for the mqtt:message sourcetype.
# These are applied at index time (TRANSFORMS-) or search time (REPORT-).
# The fields below are already present in the JSON payload written by the
# input module, but registering them here makes them available in
# field discovery and CIM mapping without a search-time rex.

[mqtt_message_fields]
DELIMS   = ","
FIELDS   = broker, mqtt_host, port, topic, qos, retain, payload

[mqtt_payload_json_kv_object]
SOURCE_KEY = payload
REGEX = "([A-Za-z0-9_\-]+)"\s*:\s*("(?:\\.|[^"])*"|true|false|null|-?\d+(?:\.\d+)?)
FORMAT = $1::$2
REPEAT_MATCH = true

[mqtt_payload_json_kv_string]
SOURCE_KEY = _raw
REGEX = \\\"((?!(?:broker|host|mqtt_host|port|topic|qos|retain|payload)\\b)[A-Za-z0-9_\-]+)\\\"\s*:\s*(\\\"(?:\\\\.|[^\\\"])*\\\"|true|false|null|-?\d+(?:\.\d+)?)
FORMAT = $1::$2
REPEAT_MATCH = true
