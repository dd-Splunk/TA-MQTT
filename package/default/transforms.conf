# Device id: 3rd path segment in topics such as home/devices/<dvc>/telemetry
[dvc_from_topic]
SOURCE_KEY = topic
REGEX      = ^[^/]+/[^/]+/(?<dvc>[A-Za-z0-9]+)/

# Message type: 4th path segment (telemetry, status, …)
[mqtt_message_type_from_topic]
SOURCE_KEY = topic
REGEX      = ^[^/]+/[^/]+/[^/]+/(?<mqtt_message_type>[^/]+)$
