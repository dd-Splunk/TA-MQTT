# TA-MQTT — field extractions for the mqtt:message sourcetype.
# These are applied at index time (TRANSFORMS-) or search time (REPORT-).
# The fields below are already present in the JSON payload written by the
# input module, but registering them here makes them available in
# field discovery and CIM mapping without a search-time rex.

[mqtt_message_fields]
DELIMS   = ","
FIELDS   = broker, host, port, topic, qos, retain, payload
