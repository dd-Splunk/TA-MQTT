# TA-MQTT — props for the mqtt:message sourcetype

[mqtt:message]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIME_FORMAT      = %s
KV_MODE          = json

# Envelope search-time extractions from MQTT topic path.
EXTRACT-dvc = dvc_from_topic
EXTRACT-mqtt_message_type = mqtt_message_type_from_topic

# CIM — indexed via HEC ``fields`` (see ``_enrich_envelope_cim``) + search-time fallbacks.
FIELDALIAS-dest = mqtt_host AS dest
FIELDALIAS-dest_port = port AS dest_port
