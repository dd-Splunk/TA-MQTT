# TA-MQTT — props for the mqtt:message sourcetype

[mqtt:message]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIME_FORMAT      = %s
KV_MODE          = json

# Use search-time JSON extraction to avoid duplicate index/search extraction.

# Extract payload JSON keys at search time from raw event content.
# This preserves raw events exactly as collected and only adds derived fields.
EXTRACT-mqtt_payload_fields = \\\"(?<_KEY_1>(?!(?:broker|host|mqtt_host|port|topic|qos|retain|payload)\\b)[A-Za-z0-9_\-]+)\\\"\s*:\s*(?<_VAL_1>\\\"(?:\\\\.|[^\\\"])*\\\"|true|false|null|-?\d+(?:\.\d+)?)

# CIM field aliases (IoT / Network Traffic model)
FIELDALIAS-dest = mqtt_host AS dest
FIELDALIAS-dest_port = port AS dest_port

# Search-time REPORT extraction above is intentionally extraction-only and does
# not rewrite event raw data.
