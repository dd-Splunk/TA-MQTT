# TA-MQTT — props for the mqtt:message sourcetype

[mqtt:message]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
TIME_FORMAT      = %s
KV_MODE          = none
AUTO_KV_JSON     = false

# Extract all top-level JSON keys as fields
INDEXED_EXTRACTIONS = json

# Also expose payload object keys as top-level fields (e.g. temp, humidity)
# in addition to payload.temp, payload.humidity.
REPORT-mqtt_payload_fields = mqtt_payload_json_kv_object

# CIM field aliases (IoT / Network Traffic model)
FIELDALIAS-dest = host AS dest
FIELDALIAS-dest_port = port AS dest_port

# Search-time REPORT extraction above is intentionally scoped to payload object
# keys so they can be queried without the payload. prefix.
